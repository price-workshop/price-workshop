baseURL = "https://price-workshop.org/"
languageCode = "en-us"
title = "PRICE Workshop"
theme = "custom"

[pagination]
pagerSize = 10

# Enable syntax highlighting
pygmentsUseClasses = true

# Output formats
[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

# Markdown rendering (allow HTML in content for component layout)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Site parameters
[params]
  description = "SIGGRAPH Workshop on Performance and Rendering in Competitive Esports (PRICE)"
  author = "PRICE Workshop Organizers"

