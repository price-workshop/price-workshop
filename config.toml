baseURL = "https://price-workshop.org/"
languageCode = "en-us"
title = "PRICE Workshop"
theme = "custom"

[pagination]
pagerSize = 10

# Enable syntax highlighting
pygmentsUseClasses = true

# Output formats
[outputs]
  home = ["HTML"]
  page = ["HTML"]

# Markdown rendering (allow HTML in content for component layout)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Menu configuration
[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    name = "Call for Papers"
    url = "/call-for-papers/"
    weight = 30
  [[menu.main]]
    name = "Schedule"
    url = "/schedule/"
    weight = 40
  [[menu.main]]
    name = "Organizers"
    url = "/organizers/"
    weight = 50
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 60

# Site parameters
[params]
  description = "SIGGRAPH Workshop on Performance and Rendering in Competitive Esports (PRICE)"
  author = "PRICE Workshop Organizers"
